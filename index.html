<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mihir | Personal Site</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 3rem 2.5rem;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid #30363d;
      margin-bottom: 1.5rem;
      background: #21262d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin-left: auto;
      margin-right: auto;
    }

    h1 {
      font-size: 2rem;
      color: #e6edf3;
      margin-bottom: 0.5rem;
    }

    .tagline {
      color: #8b949e;
      font-size: 1rem;
      margin-bottom: 2rem;
    }

    .links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      color: #58a6ff;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      transition: background 0.2s, border-color 0.2s;
    }

    .links a:hover {
      background: #30363d;
      border-color: #58a6ff;
    }

    footer {
      margin-top: 3rem;
      color: #484f58;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">👤</div>
    <h1>Mihir</h1>
    <p class="tagline">Welcome to my personal GitHub Pages site.</p>

    <div class="links">
      <a href="https://github.com/Mihir-786" target="_blank" rel="noopener noreferrer">
        ⭐ GitHub
      </a>
    </div>
  </div>

  <footer>
    Built with ❤️ and hosted on <a href="https://pages.github.com" style="color:#58a6ff">GitHub Pages</a>.
  </footer>
</body>
</html>
