name: Marketing Job Finder
on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * *"
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: job_finder/requirements.txt
      - name: Install search dependencies
        run: pip install -r job_finder/requirements.txt
      - name: Search for matching openings
        working-directory: job_finder
        run: python search.py
      - name: Upload searchable job reports
        uses: actions/upload-artifact@v4
        with:
          name: marketing-jobs
          path: |
            job_finder/latest.csv
            job_finder/latest.md
          retention-days: 30
